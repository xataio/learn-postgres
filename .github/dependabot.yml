version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # Security fixes stay separate from routine version updates. Patch and
      # minor security groups are eligible for auto-merge after CI passes.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      # Keep framework packages in sync, especially next and
      # eslint-config-next, which normally release matching versions.
      framework:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch

      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
